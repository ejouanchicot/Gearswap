<title>GearSwap Atelier</title>
<!-- GearSwap Atelier: open this file in a browser. Data: //gs c atelier in game. -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F2EF; --side:#EAE8E3; --panel:#FFFFFF; --panel-2:#F7F6F3; --hover:#EFEDE8; --ink:#1B1C1F; --muted:#5F5D58; --faint:#8F8C85;
  --line:#DEDBD4; --line-strong:#C6C2B9; --accent:#86621C; --accent-soft:#F4ECDA; --accent-ink:#FFFFFF; --aug:#7A5A1C; --well:#E6E3DC;
  --r-tank:#3F5FC4; --r-healer:#3F8A2E; --r-support:#A67C0A; --r-dd:#B04646;
  --tip-bg:#23252A; --tip-edge:#23252A;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121315; --side:#0D0E10; --panel:#18191C; --panel-2:#1E2024; --hover:#24262B; --ink:#E7E5E0; --muted:#A3A09A; --faint:#6F6D68;
  --line:#2A2C31; --line-strong:#3B3E45; --accent:#D6B370; --accent-soft:#2B261B; --accent-ink:#121315; --aug:#CDAE6E; --well:#0B0C0E;
  --r-tank:#7D9BF0; --r-healer:#86D36F; --r-support:#ECC94A; --r-dd:#E08585;
  --tip-bg:#2E3138; --tip-edge:#4A4E57;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121315; --side:#0D0E10; --panel:#18191C; --panel-2:#1E2024; --hover:#24262B; --ink:#E7E5E0; --muted:#A3A09A; --faint:#6F6D68;
  --line:#2A2C31; --line-strong:#3B3E45; --accent:#D6B370; --accent-soft:#2B261B; --accent-ink:#121315; --aug:#CDAE6E; --well:#0B0C0E;
  --r-tank:#7D9BF0; --r-healer:#86D36F; --r-support:#ECC94A; --r-dd:#E08585;
  --tip-bg:#2E3138; --tip-edge:#4A4E57;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.display{font-family:var(--display);font-weight:600;letter-spacing:.06em}
.em{background:var(--role);-webkit-mask:var(--icon) center/contain no-repeat;mask:var(--icon) center/contain no-repeat;flex:none}
.role{color:var(--role);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---- shell: sidebar + main ---- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.brand svg{color:var(--accent);flex:none}
.brand b{display:block;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.1em;line-height:1}
.brand small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.24em;color:var(--faint);margin-top:4px}
.seg{display:flex}
.seg button{flex:1;border:1px solid var(--line-strong);background:var(--panel);padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted);margin-left:-1px}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg button:last-child{border-radius:0 3px 3px 0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);position:relative;z-index:1}
.seg svg{display:block;margin:auto}
.chars{padding:0 16px 14px;border-bottom:1px solid var(--line)}
.jobnav{padding:6px 0 18px;flex:1}
.jobnav h4{margin:16px 18px 4px;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--role)}
.navjob{display:grid;grid-template-columns:20px 36px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;border:0;border-left:3px solid transparent;background:none;padding:5px 16px 5px 15px;text-align:left}
.navjob .em{width:20px;height:20px}
.navjob b{font-weight:700;font-size:14px;letter-spacing:.03em}
.navjob .nm{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navjob small{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.navjob:hover{background:var(--hover)}
.navjob[aria-current="true"]{background:var(--panel);border-left-color:var(--accent)}
.navjob.home{margin-top:10px}
.navjob.home svg{color:var(--accent);margin:auto}
.navjob.home b{grid-column:span 3;font-weight:600;letter-spacing:0}
/* language and theme, top right of the page */
.prefs{display:flex;gap:8px;justify-content:flex-end;max-width:1200px;margin-bottom:6px}
.prefs .seg button{padding:3px 10px;font-size:12px}
.main{min-width:0;padding:14px 40px 72px}
.inner{max-width:1200px}
/* Wide screens: the page never scrolls, each block that lacks room scrolls on its own */
@media (min-width:901px){
  html,body{height:100%;overflow:hidden}
  .app{height:100vh}
  .main{height:100vh;overflow:hidden;padding-bottom:0;display:flex;flex-direction:column}
  .inner{flex:1;display:flex;flex-direction:column;min-height:0}
  .pane{flex:1;min-height:0;overflow:auto;padding-bottom:24px}
  .pane.split{overflow:hidden;padding-bottom:20px}
  .split .setsx{height:100%;align-items:stretch}
  .split .setlist{position:static;max-height:none;min-height:0}
  .split .detail{align-self:start;max-height:100%;overflow:auto}
}

/* ---- page heads ---- */
.pagehead{margin-bottom:22px}
.pagehead h1{font-size:40px;line-height:1.05;margin-top:4px}
.lede{color:var(--muted);margin-top:6px;font-size:15.5px}
.jobhead{display:flex;flex-wrap:wrap;align-items:center;gap:16px 36px;margin-bottom:20px}
.jobhead .title{display:flex;align-items:center;gap:16px;margin-right:auto}
.jobhead .em{width:52px;height:52px}
.jobhead h1{font-size:38px;line-height:1}
.jobhead p{margin-top:6px;color:var(--muted);display:flex;gap:12px;align-items:baseline}
.facts{display:flex;margin:0}
.facts div{padding:0 20px;border-left:1px solid var(--line)}
.facts div:first-child{border-left:0;padding-left:0}
.facts dt{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.facts dd{margin:3px 0 0;font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.subpick{display:flex;gap:3px}
.subpick button{border:1px solid var(--line-strong);background:var(--panel);border-radius:3px;padding:0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.subpick button:hover{border-color:var(--ink);color:var(--ink)}
.subpick button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.subsel{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line-strong);border-radius:3px;padding:0 4px;height:22px}
.subsel[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.subpick button.own{position:relative}
.subpick button.own::after{content:"";position:absolute;top:-3px;right:-3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sections{display:flex;gap:28px;box-shadow:inset 0 -1px 0 var(--line);margin-bottom:22px;overflow-x:auto;overflow-y:hidden}
.sections button{border:0;background:none;padding:10px 0 9px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.sections button:hover{color:var(--ink)}
.sections button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-weight:400;color:var(--faint);margin-left:6px;font-variant-numeric:tabular-nums}

/* ---- buttons ---- */
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn[disabled]{opacity:.4;cursor:default}

/* ---- sets: list + detail ---- */
.setsx{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.setlist{background:var(--panel);border:1px solid var(--line);border-radius:4px;position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.setlist .search{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.setlist input{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:3px;background:var(--panel-2);color:var(--ink)}
.setlist input::placeholder{color:var(--faint)}
.setlist .scroll{overflow:auto;padding-bottom:6px}
.fam{display:flex;justify-content:space-between;padding:14px 12px 4px 13px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fam span:last-child{color:var(--faint);letter-spacing:0;font-variant-numeric:tabular-nums}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;width:100%;border:0;border-left:3px solid transparent;background:none;padding:5px 12px 5px 10px;text-align:left}
.setrow b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow small{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;align-self:center}
.setrow code{grid-column:1 / -1;font-family:var(--mono);font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow:hover{background:var(--hover)}
.setrow[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.setrow[aria-current="true"] code{color:var(--muted)}
.empty-list{padding:18px 14px;color:var(--muted);font-size:14px}
.hint{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}
.detail header{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:3px}
.detail .titleline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.detail h2{font-size:21px;font-weight:700;line-height:1.15}
.detail .when{color:var(--muted);font-size:13px;text-transform:none;letter-spacing:0;font-weight:400}
.detail .path{font-family:var(--mono);font-size:12px;color:var(--faint);overflow-wrap:anywhere}
.variants{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-height:96px;overflow:auto}
.variants button{border:1px solid var(--line-strong);background:var(--panel-2);border-radius:3px;font-size:13px;padding:2px 10px}
.variants button:hover{border-color:var(--ink)}
.variants button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.slot{background:var(--panel);border:0;border-left:3px solid transparent;padding:6px 10px 6px 7px;min-height:50px;text-align:left;display:grid;grid-template-columns:36px minmax(0,1fr);gap:0 9px;align-items:center;position:relative}
.slot .txt{display:grid;min-width:0}
.ico{width:36px;height:36px;border:1px solid var(--line-strong);border-radius:3px;background:var(--well);display:grid;place-items:center;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.ico img{width:32px;height:32px;display:block}
.slot.empty .ico{background:transparent;border-style:dashed;box-shadow:none}
.slot.inh .ico img{opacity:.5}
.slot:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.slot .lbl{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);line-height:1.3}
.slot .item{font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .item .mk{color:var(--aug);font-size:10px;margin-left:5px;vertical-align:1px}
.slot.empty .item{color:var(--faint);font-weight:400}
.slot.inh{background:var(--panel-2)}
.slot.weap{border-left-color:var(--accent)}
.weaps{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.weaps label{display:inline-flex;align-items:center;gap:6px}
.weapsel{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-strong);border-radius:3px;padding:1px 4px}
.weaps label.picked .weapsel{border-color:var(--accent);color:var(--accent)}
.weaps label[title]{cursor:help}
.slot.inh .item{color:var(--muted);font-weight:400}
.slot.hit{box-shadow:inset 0 0 0 2px var(--accent)}
.detail footer{padding:9px 18px;font-size:13px;color:var(--muted);display:grid;gap:2px}
.detail footer details summary{cursor:pointer}
.detail footer details p{margin:4px 0 0;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.detail footer b{color:var(--ink);font-weight:600}
.setstats{padding:14px 22px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 28px}
.statgrid h4{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.statlist{list-style:none;margin:0;padding:0;font-size:13.5px}
.statlist li{display:grid;grid-template-columns:minmax(0,1fr) 58px 60px;align-items:baseline;column-gap:8px;padding:3px 0;border-bottom:1px dotted var(--line)}
.statlist span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statlist b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.statlist i{font-style:normal;font-size:11.5px;color:var(--faint);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.statlist li.over b{color:var(--r-dd)}
.statlist li[title]{cursor:help}
.setstats p{margin:0;font-size:12.5px;color:var(--muted)}
.conds summary{cursor:pointer;font-size:13px;color:var(--muted)}
.conds ul,.plain{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.piecestats{display:grid;gap:6px}
.piecestats .weapon{margin:0;font-weight:600}
.piecestats .origin{margin:0;font-size:12.5px;color:var(--accent)}
.globals{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:grid;gap:8px;align-content:start}
.globals .kicker.sub{margin-top:6px;color:var(--muted)}
.globals .statlist.big{font-size:15px}
.globals .statlist.big b{font-size:16px}
.globals .small{font-size:12px;margin:4px 0 0}
.delta{font-style:normal;font-size:11.5px;margin-left:6px;font-weight:600}
.delta.up{color:var(--r-healer)}
.delta.down{color:var(--r-dd)}
.globals-inline .globals{border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 18px;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));column-gap:28px;align-items:start}
.globals-inline .globals > .kicker,.globals-inline .globals > p{grid-column:1 / -1}
.globalcol{display:none}
@media (min-width:1650px){
  .setsx{grid-template-columns:250px minmax(0,1fr) 300px}
  .inner,.prefs{max-width:1560px}
  .globalcol{display:block;min-width:0}
  .globals-inline{display:none}
  .split .globalcol{max-height:100%;overflow:auto;align-self:start}
}
.meritbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:14px}
.meritbar p{margin:0;max-width:760px;font-size:13.5px}
/* columns, not a grid: each group stacks under the previous one, no row as tall as the longest group */
.meritgrid{columns:300px;column-gap:28px}
.meritgrid section{break-inside:avoid;margin-bottom:10px}
.meritgrid h4{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.meritgrid section{padding-top:2px}
.meritgrid section + section{margin-top:6px}
.meritlist{list-style:none;margin:0;padding:0;font-size:13.5px}
.meritlist li{display:grid;grid-template-columns:minmax(0,1fr) 54px 92px;align-items:center;column-gap:8px;padding:2px 0 2px 12px;border-bottom:1px dotted var(--line);position:relative}
.meritlist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help}
.meritlist i{font-style:normal;font-size:11.5px;color:var(--faint);text-align:right;white-space:nowrap}
.meritin{font:inherit;font-size:13px;font-weight:600;width:54px;padding:1px 4px;text-align:right;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-strong);border-radius:3px;font-variant-numeric:tabular-nums}
.meritlist li.changed::before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.meritlist li.changed .meritin{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.globals .edited{color:var(--accent);letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:1px solid var(--line-strong);background:var(--panel)}
.legend i.inh{background:var(--panel-2)}
.legend i.weap{border-left:3px solid var(--accent)}
.legend b.mk{color:var(--aug);font-size:10px}
.tip{--ink:#F2F0EB; --muted:#BDBAB3; --faint:#8E8B84; --line:#454951; --aug:#E6C47E;
  position:fixed;z-index:60;width:320px;max-height:calc(100vh - 24px);overflow:auto;background:var(--tip-bg);color:var(--ink);
  border:1px solid var(--tip-edge);border-top:2px solid var(--aug);border-radius:4px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:11px 13px;font-size:12.5px;pointer-events:none}
.tip[hidden]{display:none}
.tip .th{display:grid;grid-template-columns:36px minmax(0,1fr);gap:0 10px;align-items:center;margin-bottom:8px}
.tip .th b{font-size:14.5px;display:block}
.tip .th small{color:var(--muted);font-size:12px}
.tip.wide{width:440px}
.tip .attrs{display:flex;flex-wrap:wrap;gap:2px 12px;padding:4px 0 5px;border-bottom:1px dotted var(--line);font-variant-numeric:tabular-nums}
.tip .attrs span{white-space:nowrap;color:var(--muted)}
.tip .attrs b{color:var(--ink);font-weight:700;margin-left:3px}
.tip .rows{display:grid;grid-template-columns:minmax(0,1fr);column-gap:18px;font-variant-numeric:tabular-nums}
.tip.wide .rows{grid-template-columns:repeat(2,minmax(0,1fr))}
.tip .r{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dotted var(--line)}
.tip .r span{min-width:0}
.tip .r b{font-weight:700;white-space:nowrap}
.tip .a{font-style:normal;color:var(--aug);font-weight:600;font-size:11.5px;margin-right:5px}
.tip .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:9px 0 3px}
.tip ul{margin:0;padding-left:16px;color:var(--muted);font-size:12.5px}
@media (max-width:640px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- tables ---- */
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{padding:8px 16px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl thead th{border-top:0;background:var(--panel-2);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tbl tr.grp th{background:var(--panel-2);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding-top:10px}
.tbl tbody tr:not(.grp):hover td{background:var(--hover)}
.tbl tr.other-sub td{opacity:.45}
.tbl .r{text-align:right}
.tbl .file{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}
.tbl .state{display:block;font-family:var(--mono);font-size:12px;color:var(--faint)}
.tbl .sub{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.tbl.click tbody tr{cursor:pointer}
.jobcell{display:flex;align-items:center;gap:10px;white-space:nowrap}
.jobcell .em{width:22px;height:22px}
.jobcell b{font-weight:700;letter-spacing:.03em;min-width:34px}
.kbd{display:inline-flex;gap:3px;white-space:nowrap}
kbd{font-family:var(--mono);font-size:12px;padding:1px 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;background:var(--panel-2);color:var(--ink)}
.kbd.none{font-size:13px;color:var(--faint)}
.values{display:flex;flex-wrap:wrap;gap:4px}
.values span{font-size:13px;padding:1px 8px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.values span.def{color:var(--ink);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
details.more{margin-top:16px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0;margin-bottom:6px}
.sw{display:inline-block;width:32px;height:18px;border-radius:9px;background:var(--line-strong);position:relative;vertical-align:middle}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel)}
.sw.on{background:var(--accent)}
.sw.on::after{left:16px}
.note-foot{margin-top:16px;font-size:13px;color:var(--faint)}

/* ---- macro / lockstyle ---- */
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.panel .head{padding:18px 22px 16px;display:grid;gap:2px}
.panel .big{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.panel .head p{color:var(--muted);font-size:14px}
.panel .tbl td:first-child{width:30%}
.placeholder{background:var(--panel);border:1px dashed var(--line-strong);border-radius:4px;padding:36px;text-align:center;color:var(--muted);display:grid;gap:14px;justify-items:center}

/* ---- drawer / dialog ---- */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column}
.drawer header{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.drawer header small{color:var(--muted);font-size:13px}
.drawer header h3{font-size:20px;font-weight:700}
.drawer .body{padding:18px 22px;overflow:auto;display:grid;gap:14px;align-content:start}
.note{font-size:14px;border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px}
.choice{display:grid;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.choice .kicker{padding:10px 14px 6px;color:var(--muted)}
.choice button{text-align:left;border:0;border-top:1px solid var(--line);background:var(--panel);padding:8px 14px;font-weight:600;display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 12px;align-items:center}
.choice button > span:last-child{display:grid}
.choice button:hover{background:var(--hover)}
.choice button small{display:block;color:var(--faint);font-size:12.5px;font-weight:400}
.drawer footer,.dialog footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:4px;z-index:41}
.dialog header{padding:22px 24px 12px;display:grid;gap:10px}
.dialog header h3{font-size:20px;font-weight:700}
.steps{display:flex;gap:18px;font-size:13px;color:var(--faint);flex-wrap:wrap}
.steps span.on{color:var(--ink);font-weight:600;box-shadow:0 2px 0 var(--accent)}
.dialog .body{padding:8px 24px 20px;display:grid;gap:6px}
.opt{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:10px 14px}
.opt:hover{border-color:var(--accent);background:var(--hover)}
.opt small{display:block;color:var(--muted);font-size:13px}
.opt .state{font-size:12px;white-space:nowrap;color:var(--faint)}
.dialog footer{justify-content:space-between}
.mock{font-size:13px;color:var(--faint);padding-top:10px}

@media (max-width:900px){
  .app{display:block}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:14px 16px 10px}
  .jobnav{display:flex;gap:2px;overflow-x:auto;padding:4px 8px 8px;flex:none}
  .jobnav h4{display:none}
  .navjob{display:flex;width:auto;padding:6px 10px;border-left:0;border-bottom:2px solid transparent;white-space:nowrap}
  .navjob .nm,.navjob small{display:none}
  .navjob[aria-current="true"]{border-bottom-color:var(--accent)}
  .navjob.home{margin-top:0}
  .main{padding:20px 16px 56px}
  .setsx{grid-template-columns:minmax(0,1fr)}
  .setlist{position:static;max-height:340px}
  .facts{flex-wrap:wrap;gap:10px 0}
}

  if (/^sets\.precast\.WS/.test(p)) return 'ws';

/* ---- merits: the game's levels, which the page lets you change to test ---- */
// What one level gives, read from the game's description ("Adjust your maximum HP by 10 points");
// null for a merit that changes no stat the page shows (a recast, a duration...)
function meritEffect(m){
  const d = m.desc || ''; let x;
  // only the general merits move the stats (ids below 384): a job's "Increase maximum HP by 50"
  // (NIN Yonin Effect) holds under its ability only
  const general = !(m.id >= 384);
  if (general && (x = d.match(/maximum (HP|MP) by (\d+)/))) return {key: x[1].toLowerCase(), per: +x[2], unit: ' ' + x[1]};
  if (general && (x = d.match(/Adjust your (STR|DEX|VIT|AGI|INT|MND|CHR) by (\d+)/))) return {key: x[1].toLowerCase(), per: +x[2], unit: ' ' + x[1]};
  if (general && (x = d.match(/spell interruption rate by (\d+) percent/))) return {key: 'sird', per: +x[1], unit: ' %'};
  if (general && (x = d.match(/enemies' critical hit rate by (\d+) percent/))) return {key: 'ecrit', per: -x[1], unit: ' %'};
  if (general && (x = d.match(/Adjust your critical hit rate by (\d+) percent/))) return {key: 'crit', per: +x[1], unit: ' %'};
  if ((x = d.match(/(Increase|Decrease) your enmity (\d+)/))) return {key: general ? 'enmity' : null, per: (x[1] === 'Increase' ? 1 : -1) * x[2], unit: ''};
  if ((x = d.match(/skill by (\d+) points/))) return {per: +x[1], unit: ''};
  // the verb gives the sign: "Shorten recast time by 10 seconds" is -10 s a level
  if ((x = d.match(/(\w+)[^.]*? by (\d+(?:\.\d+)?)\s*(percent|%|points?|seconds?)?/))) {
    const sign = /^(shorten|decrease|reduce|lower)/i.test(x[1]) ? -1 : 1;
    return {per: sign * x[2], unit: /^(percent|%)$/.test(x[3] || '') ? ' %' : /^second/.test(x[3] || '') ? ' s' : ''};
  }
  return null;
}
const meritKey = () => S.char + '|' + S.job;
// The merits of the latest measure (general ones and the job's two groups), or null
function meritList(){ const c = measuredChar(); return (c && c.merit_list) || null; }
const meritLevel = m => { const e = (S.meritEdits[meritKey()] || {})[m.key]; return e ?? m.level; };
// What the merits set in the page change, by stat: (level set - level measured) x one level
function meritDelta(){
  const out = {};
  for (const m of meritList() || []) {
    const e = meritEffect(m), lv = meritLevel(m);
    if (e && e.key && lv !== m.level) out[e.key] = (out[e.key] || 0) + (lv - m.level) * e.per;
  }
  return out;
}
const MERIT_GROUPS = [[64, 128, 'mgHp'], [128, 192, 'mgAttr'], [192, 256, 'mgCombat'], [256, 320, 'mgMagic'], [320, 384, 'mgOther'],
  [384, 2048, 'mgJob1'], [2048, 9999, 'mgJob2']];

  const list = meritList(), c = measuredChar();
  if (!list) return `<div class="placeholder"><p>${t('noMerits')}</p></div>`;
  const edits = S.meritEdits[meritKey()] || {};
  const groups = MERIT_GROUPS.map(([lo, hi, label]) => {
    const rows = list.filter(m => m.id >= lo && m.id < hi && m.key !== 'maximum_merit_points').map(m => {
      const e = meritEffect(m), lv = meritLevel(m), changed = m.key in edits;
      const total = e ? `${e.per * lv > 0 ? '+' : e.per * lv < 0 ? '−' : ''}${Math.abs(e.per * lv)}${e.unit}` : '';
      return `<li class="${changed ? 'changed' : ''}"><span title="${esc(m.desc)}">${esc(m.en)}</span>` +
        `<input class="meritin" id="merit-${esc(m.key)}" data-merit="${esc(m.key)}" type="number" min="0" max="15" value="${lv}">` +
        `<i>${changed ? `${t('inGame')} ${m.level} · ` : ''}${esc(total)}</i></li>`; }).join('');
    return rows ? `<section><h4>${t(label)}</h4><ul class="meritlist">${rows}</ul></section>` : '';
  }).join('');
  const n = Object.keys(edits).length;
  return `<div class="meritbar"><p class="muted">${t('meritsNote', {at: esc(c.at), s: esc(c.sub || '—')})}</p>` +
    (n ? `<button class="btn ghost" data-action="meritreset">${t('meritsReset', {n})}</button>` : '') + `</div><div class="meritgrid">${groups}</div>`;
}

/* ---- Accuracy and Evasion: wsdist's formulas (IzaKastra, create_player.py) ---- */
// Job traits, highest tier first: [level, value]. The main job's counts, the subjob's only
// when higher (they do not stack)
const TRAITS = {
  acc: {rng: [[96, 73], [86, 60], [70, 48], [50, 35], [30, 22], [10, 10]], drg: [[76, 35], [60, 22], [30, 10]],
    dnc: [[76, 35], [60, 22], [30, 10]], run: [[90, 35], [70, 22], [50, 10]]},
  eva: {thf: [[88, 72], [76, 60], [70, 48], [50, 35], [30, 22], [10, 10]], dnc: [[86, 48], [75, 35], [45, 22], [15, 10]],
    pup: [[76, 48], [60, 35], [40, 22], [20, 10]]},
  stp: {sam: [[90, 30], [70, 25], [50, 20], [30, 15], [10, 10]]},
  da: {war: [[99, 18], [85, 16], [75, 14], [50, 12], [25, 10]]},
  dw: {nin: [[85, 35], [65, 30], [45, 25], [25, 15], [10, 10]], dnc: [[80, 30], [60, 25], [40, 15], [20, 10]], thf: [[98, 25], [90, 15], [83, 10]]},
  mdb: {run: [[99, 22], [91, 20], [76, 18], [70, 16], [50, 14], [30, 12], [10, 10]], whm: [[91, 20], [81, 18], [70, 16], [50, 14], [30, 12], [10, 10]],
    rdm: [[96, 14], [45, 12], [25, 10]]},
};
// Job point gifts of the main job, all of them (2100 job points spent)
const GIFTS = {
  war: {acc: 26, eva: 36, meva: 36, macc: 36, da: 10}, mnk: {acc: 41, eva: 42, meva: 36, macc: 36}, whm: {acc: 14, macc: 70, mdb: 50},
  blm: {macc: 32, meva: 42, mdb: 14}, rdm: {acc: 22, macc: 90, mdb: 28, meva: 56}, thf: {acc: 36, eva: 70, meva: 36, macc: 36, dw: 5},
  pld: {acc: 28, eva: 22, meva: 42, macc: 42}, drk: {acc: 22, eva: 22, meva: 36, macc: 42}, bst: {acc: 36, eva: 36, meva: 36, macc: 36},
  brd: {acc: 21, eva: 22, meva: 36, macc: 36, mdb: 15}, rng: {acc: 70, eva: 14, meva: 36}, smn: {eva: 22, meva: 22, mdb: 22},
  sam: {acc: 36, eva: 36, meva: 36, stp: 8}, nin: {acc: 56, eva: 64, meva: 50, macc: 50}, drg: {acc: 64, eva: 36, meva: 36},
  blu: {acc: 36, eva: 36, meva: 36, mdb: 36}, cor: {acc: 36, eva: 22, meva: 36, macc: 36}, pup: {acc: 50, eva: 56, meva: 36, macc: 36},
  dnc: {acc: 64, eva: 64, meva: 36, macc: 36, dw: 5}, sch: {meva: 42, macc: 42, mdb: 22}, geo: {macc: 50, meva: 50, mdb: 28},
  run: {acc: 56, eva: 56, meva: 70, macc: 36, mdb: 56},
};
function traitOf(stat, c){
  const tier = (job, level) => { const list = (TRAITS[stat] || {})[(job || '').toLowerCase()] || [];
    const hit = list.find(([lv]) => (level || 0) >= lv); return hit ? hit[1] : 0; };
  return Math.max(tier(S.job, c.main_level || 99), tier(c.sub, c.sub_level || 0));
}
const giftOf = (stat, c) => (c.jp_spent || 0) >= 2100 ? ((GIFTS[(S.job || '').toLowerCase()] || {})[stat] || 0) : 0;
// Accuracy from a combat skill, by steps: 1 a point to 200, 0.9 to 400, 0.8 to 600, 0.9 past it
function skillAcc(level){
  let a = Math.min(level, 200);
  if (level > 200) a += Math.floor((Math.min(level, 400) - 200) * 0.9);
  if (level > 400) a += Math.floor((Math.min(level, 600) - 400) * 0.8);
  if (level > 600) a += Math.floor((level - 600) * 0.9);
  return a;
}
// Evasion from the evasion skill: 1 a point to 300, 0.8 past it
const skillEva = level => level > 300 ? Math.floor(300 + 0.8 * (level - 300)) : level;
// A skill level read in game, by its name ("Great Sword" and "great_sword" alike)
function skillLevel(c, name){
  const want = (name || '').toLowerCase().replace(/[^a-z]/g, '');
  for (const [k, v] of Object.entries(c.skills || {})) if (k.toLowerCase().replace(/[^a-z]/g, '') === want) return v;
  return 0;
}
// Accuracy and Evasion of a gear total: main hand Accuracy = 0.75 x DEX + gear + its skill's
// steps + traits + gifts; Evasion = 0.5 x AGI + gear + the evasion skill's steps + traits + gifts
function combatOf(c, gear, dex, agi, mainName){
  const g = k => (gear[k] || {}).v || 0;
  const wskill = mainName && Object.assign({}, ...Object.values(exportsOf(S.char, S.job)).map(x => x.wskill || {}))[mainName];
  const level = wskill ? skillLevel(c, wskill) + g('skill:' + wskill.toLowerCase() + ' skill') : 0;
  const acc = Math.floor(0.75 * dex) + g('acc') + (wskill ? skillAcc(level) : 0) + traitOf('acc', c) + giftOf('acc', c);
  const eva = Math.floor(0.5 * agi) + g('eva') + skillEva(skillLevel(c, 'evasion') + g('skill:evasion skill')) + traitOf('eva', c) + giftOf('eva', c);
  return {acc, eva, wskill, level};
}

/* ---- the character's real stats with a set ---- */
// The stats measured in game by //gs c atelier (this subjob's export, else another one's)
// The measure taken on the shown subjob if there is one, else the latest of the job (an offline
// export carries a copy of an older measure: the newest one has the latest merits)
function measuredChar(){
  const d = data(), all = Object.values(exportsOf(S.char, S.job)).map(x => x.char).filter(c => c && c.base);
  const latest = list => list.sort((a, b) => (b.at || '').localeCompare(a.at || ''))[0] || null;
  return latest(all.filter(c => d && c.sub === d.sub)) || latest(all);
}
function gearTotal(pieces){
  const total = {};
  for (const slot of SLOTS) { const r = pieceStats(pieces[slot]); if (r) for (const [k, e] of Object.entries(r.stats)) add(total, k, e.v, e.unit, e.label); }
  return total;
}
// Measured stats minus the gear worn when measured, plus the set's gear. HP / MP: the
// % of gear applies to base + gear HP (Guide_Paladin solver_common.effective_hp);
// DEF moves with VIT x1.5 (calc_defense), Attack with STR (wsdist: 8 + skill + STR + Attack)
function charStats(s){
  const c = measuredChar();
  if (!c || !c.base) return null;
  const worn = gearTotal(c.worn || {}), set = setStats(s).total;
  const g = (o, k) => (o[k] || {}).v || 0;
  const out = {};
  // merits changed in the page (Merits tab) move the base: Max HP before the gear's HP %
  const md = meritDelta();
  for (const a of ATTRS) { const now = (c.base[a] || 0) + (c.add[a] || 0); out[a] = {now, set: now - g(worn, a) + g(set, a) + (md[a] || 0)}; }
  const pool = (max, k) => {
    const naked = max / (1 + g(worn, k + '%') / 100) - g(worn, k) + (md[k] || 0);
    return Math.round((naked + g(set, k)) * (1 + g(set, k + '%') / 100));
  };
  out.hp = {now: c.max_hp, set: pool(c.max_hp, 'hp')};
  out.mp = {now: c.max_mp, set: pool(c.max_mp, 'mp')};
  out.def = {now: c.defense, set: Math.floor(c.defense + g(set, 'def') - g(worn, 'def') + 1.5 * (out.vit.set - out.vit.now))};
  out.atk = {now: c.attack, set: c.attack + g(set, 'atk') - g(worn, 'atk') + (out.str.set - out.str.now)};
  // Accuracy and Evasion are not in the status window: computed for the worn gear and the set alike
  if (c.skills && Object.keys(c.skills).length) {
    const was = combatOf(c, worn, out.dex.now, out.agi.now, (c.worn && c.worn.main || {}).name);
    const now = combatOf(c, set, out.dex.set, out.agi.set, (withWeapons(s).pieces.main || {}).name);
    out.acc = {now: was.acc, set: now.acc, tip: now.wskill ? `${now.wskill} ${now.level}` : ''};
    out.eva = {now: was.eva, set: now.eva};
  }
  return {c, out, set};
}
function globalsHTML(s){
  const r = charStats(s);
  if (!r) return `<div class="globals"><div class="kicker">${t('youTitle')}</div><p class="muted">${t('noChar')}</p></div>`;
  const {c, out, set} = r;
  const row = (label, o) => { const d = o.set - o.now;
    return statLi(label, o.set, d ? `<em class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${Math.abs(d)}</em>` : ''); };
  const v = k => (set[k] || {}).v || 0;
  const pct = (label, sum, cap) => cappedLi(label, sum, cap, '');
  const main = [['HP', out.hp], ['MP', out.mp], [t('defLabel'), out.def], [t('atkLabel'), out.atk], [t('accLabel'), out.acc], [t('evaLabel'), out.eva]]
    .filter(([, o]) => o).map(([l, o]) => row(l, o)).join('');
  const attrs = ATTRS.map(a => row(a.toUpperCase(), out[a])).join('');
  // merits the game counts per level (res/merit_points.lua: "Spell Interruption Rate" 2 % a level)
  const merit = name => Object.entries(c.merits || {}).reduce((n, [k, lv]) => k.toLowerCase().replace(/_/g, ' ') === name ? n + lv : n, 0);
  const sirdMerit = (meritList() || []).find(x => x.key === 'spell_interruption_rate');
  const sirdMerits = sirdMerit ? 2 * meritLevel(sirdMerit) : 2 * merit('spell interruption rate');
  const sird = v('sird') + sirdMerits;
  const gear = damageTakenLines(v) + pct('Haste', v('haste'), 25) + pct('Fast Cast', v('fc'), 80) +
    (sird ? statLi('SIRD', sird + ' %', sirdMerits ? `<em class="delta">${t('withMerits')}</em>` : '', '', `${t('gearOnly')} ${v('sird')} % + ${t('merits')} ${sirdMerits} %`) : '');
  const levels = [c.master_level ? `ML ${c.master_level}` : '', c.jp_spent ? `${c.jp_spent} JP` : ''].filter(Boolean).join(' · ');
  const edited = Object.keys(S.meritEdits[meritKey()] || {}).length;
  return `<div class="globals"><div class="kicker">${t('youTitle')}${edited ? ` <span class="edited">· ${t('meritsEdited', {n: edited})}</span>` : ''}</div>` +
    `<ul class="statlist big">${main}</ul><ul class="statlist">${attrs}</ul>` +
    `<div class="kicker sub">${t('gearKey')}</div><ul class="statlist">${gear}</ul>` +
    `<p class="muted small">${levels ? esc(levels) + ' · ' : ''}${t('measured', {at: esc(c.at), s: esc(c.sub || '—')})}</p></div>`;
}

function openSlot(ci, slot){
  const card = S._cards[ci]; const vi = Math.min(S.variant[S.job+'|'+ci] ?? 0, card.variants.length-1);
  const s = card.variants[vi].set; const p = withWeapons(s).pieces[slot]; const own = new Set(s.own || Object.keys(s.pieces));
  const label = SLOT_NAMES[S.lang][slot];
  const seen = {}; for (const x of data().sets) { const q = x.pieces[slot]; if (q) seen[q.name] = (seen[q.name]||0)+1; }
  const owned = (ofAnySub('items') || {})[slot];
  const items = owned ? owned.map(n => [n, seen[n] || 0]) : Object.entries(seen).sort((a,b) => b[1]-a[1]);
  const weap = withWeapons(s).from[slot];
  const notes = !p ? t('drawerEmpty') : weap ? t('drawerWeap', {m: weap}) : (s.base && !own.has(slot)) ? t('drawerInh',{b:shortPath(s.base)}) : t('drawerOwn');
  let html = `<div class="note">${esc(notes)}</div>${pieceStatsHTML(p)}`;
  if (s.aliases && s.aliases.length) html += `<div class="note">${esc(t('drawerShared',{n:s.aliases.length}))}</div>`;
  html += `<div class="choice"><div class="kicker">${t('yourItems')}</div>${items.map(([n,c]) => `<button type="button">${icon(n)}<span>${esc(n)}<small>${c ? t('seenIn',{n:c}) : t('inBags')}</small></span></button>`).join('')}</div>`;
  $('#overlay').innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="${label}">
    <header><small>${esc(niceName(card))} · <span style="font-family:var(--mono)">${esc(s.path)}</span></small><h3>${label} : ${p?esc(p.name):'—'}</h3></header>
    <div class="body">${html}</div><footer><button class="btn ghost" data-close>${t('close')}</button><button class="btn" data-close>${t('apply')}</button></footer></aside>`;
  $('#overlay').hidden = false;
}
/* ---- add set ---- */
let addStep = 0, addFam = null, addBase = null;
function renderAdd(){
  const cards = S._cards || buildCards(data()).cards;
  const steps = [t('step1'),t('step2'),t('step3')].map((s,i) => `<span class="${i===addStep?'on':''}">${i+1}. ${s}</span>`).join('');
  let body;
  if (addStep===0) body = [...new Set(cards.map(c => c.fam))].map(f => `<button class="opt" data-addfam="${f}"><span>${t('fam.'+f)}<small>${t('famWhen.'+f)}</small></span><span>›</span></button>`).join('');
  else if (addStep===1) body = cards.filter(c => c.fam===addFam).flatMap(c => c.variants.map(v => v.set.path)).map(p =>
      `<button class="opt" data-addbase="${esc(p)}"><span style="font-family:var(--mono);font-size:13px">${esc(p)}</span><span class="state">${t('exists')}</span></button>`).join('') + `<p class="mock">${t('catalog')}</p>`;
  else body = [[t('fromEmpty'),t('fromEmptyD')],[t('fromCopy',{b:shortPath(addBase)}),t('fromCopyD')],[t('fromWorn'),t('fromWornD')]]
      .map(([a,b]) => `<button class="opt" data-close><span>${esc(a)}<small>${esc(b)}</small></span><span>›</span></button>`).join('');
  $('#overlay').innerHTML = `<div class="scrim" data-close></div><div class="dialog" role="dialog" aria-label="${t('addTitle')}"><header><h3>${t('addTitle')}</h3><div class="steps">${steps}</div></header>
    <div class="body">${body}</div><footer><button class="btn ghost" data-back ${addStep===0?'disabled':''}>${t('back')}</button><button class="btn ghost" data-close>${t('cancel')}</button></footer></div>`;
  $('#overlay').hidden = false;
}
function closeOverlay(){ $('#overlay').hidden = true; $('#overlay').innerHTML = ''; }

document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-close],tr[data-job]'); if (!b) return; const d = b.dataset;
  if (d.char) { S.char = d.char; S.job = null; closeOverlay(); render(); return; }
  if (d.subpick) { S.subs[S.char + '|' + S.job] = d.subpick; render(); return; }
  if (d.lang) { S.lang = d.lang; render(); return; }
  if (d.themeSet) { S.theme = d.themeSet; render(); return; }
  if ('job' in d) { S.job = d.job || null; S.section = 'sets'; S.q = ''; render(); scrollTo({top:0}); return; }
  if (d.section) { S.section = d.section; render(); return; }
  if (d.pick) { S.sel[S.job] = +d.pick; render(); return; }
  if (d.variant) { S.variant[S.job+'|'+d.card] = +d.variant; render(); return; }
  if (d.slot) { openSlot(+d.card, d.slot); return; }
  if (d.action==='add') { addStep = 0; renderAdd(); return; }
  if (d.action==='meritreset') { delete S.meritEdits[meritKey()]; render(); return; }
  if (d.addfam) { addFam = d.addfam; addStep = 1; renderAdd(); return; }
  if (d.addbase) { addBase = d.addbase; addStep = 2; renderAdd(); return; }
  if ('back' in d) { addStep = Math.max(0, addStep-1); renderAdd(); return; }
  if ('close' in d) closeOverlay();
});
document.addEventListener('input', e => {
  if (e.target.id === 'setq') { S.q = e.target.value; render(); }
  // a merit level typed in the Merits tab: kept while it differs from the game's
  if (e.target.classList.contains('meritin')) {
    const m = (meritList() || []).find(x => x.key === e.target.dataset.merit), v = parseInt(e.target.value, 10);
    const edits = S.meritEdits[meritKey()] = S.meritEdits[meritKey()] || {};
    if (!m || isNaN(v)) return;
    if (v === m.level) delete edits[m.key]; else edits[m.key] = Math.max(0, Math.min(15, v));
    render();
  }
});
document.addEventListener('change', e => {
  if (e.target.classList.contains('subsel') && e.target.value) { S.subs[S.char + '|' + S.job] = e.target.value; render(); }
  if (e.target.classList.contains('weapsel')) { const k = S.char + '|' + S.job + '|' + e.target.dataset.mode;
    if (e.target.value) S.weapons[k] = e.target.value; else delete S.weapons[k]; render(); }
});
/* ---- the hover card of a piece: what it brings, base and augments apart ---- */
function tipHTML(card, slot){
  const s = shownSet(card.c, card.i), eff = withWeapons(s), p = eff.pieces[slot];
  const label = SLOT_NAMES[S.lang][slot];
  if (!p) return `<div class="th">${icon(null)}<div><b>${label}</b><small>${slot === 'main' || slot === 'sub' ? t('emptyWeapon') : t('empty')}</small></div></div>`;
  const r = pieceStats(p);
  let body = '';
  if (r && r.known) {
    const keys = Object.keys(r.stats).filter(k => r.stats[k].v);
    const order = STAT_GROUPS.flatMap(([g]) => keys.filter(k => statGroup(k) === g).sort(statOrder));
    // The augment part in front of the total: the base is what remains
    const aug = k => r.aug[k] && r.aug[k].v ? `<i class="a">◆${fmtStat(r.aug[k])}</i>` : '';
    const attrs = order.filter(k => statGroup(k) === 'attr'), rest = order.filter(k => statGroup(k) !== 'attr');
    if (attrs.length) body += `<div class="attrs">${attrs.map(k => `<span>${esc(statLabel(k, r.stats[k]))}${aug(k)}<b>${fmtStat(r.stats[k])}</b></span>`).join('')}</div>`;
    body += `<div class="rows">${rest.map(k => `<div class="r"><span title="${esc(statLabel(k, r.stats[k]))}">${esc(statLabel(k, r.stats[k]))}</span><b>${aug(k)}${fmtStat(r.stats[k])}</b></div>`).join('')}</div>`;
    const notes = [r.scanned ? t('fromScan') : '', r.rank ? t('rankKnown', {p: esc(r.path), r: r.rank}) : '',
      r.path && !r.rank ? t('pathOne', {p: esc(r.path)}) : '', r.hidden ? t('hiddenFc') : ''].filter(Boolean);
    if (notes.length) body += `<div class="k">${t('tipNotes')}</div><ul>${notes.map(n => `<li>${n}</li>`).join('')}</ul>`;
    if (r.free.length) body += `<div class="k">${t('effects')}</div><ul>${r.free.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
    if (r.cond.length) body += `<div class="k">${t('condTitle')}</div><ul>${r.cond.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
  } else body = `<p class="muted">${t('noDesc')}</p>`;
  const weapon = r && r.weapon ? ` · ${Object.entries(r.weapon).map(([k, n]) => `${k} ${n}`).join(' · ')}` : '';
  return `<div class="th">${icon(p.name)}<div><b>${esc(p.name)}</b><small>${label}${weapon}</small></div></div>${body}`;
}
// Placed beside the hovered slot, on the side with room, kept inside the window
function showTip(el){
  const tip = $('#tip'), ci = +el.dataset.card, card = S._cards && S._cards[ci];
  if (!card) return;
  tip.innerHTML = tipHTML({c: card, i: ci}, el.dataset.slot);
  tip.classList.toggle('wide', tip.querySelectorAll('.r').length > 6);
  tip.hidden = false;
  const b = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const left = b.right + 8 + w < innerWidth ? b.right + 8 : Math.max(8, b.left - 8 - w);
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, Math.min(b.top, innerHeight - h - 8)) + 'px';
}
document.addEventListener('mouseover', e => { const el = e.target.closest('.slot[data-slot]'); if (el) showTip(el); });
document.addEventListener('mouseout', e => { if (e.target.closest('.slot[data-slot]') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.slot[data-slot]'))) $('#tip').hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest('.slot[data-slot]'); if (el) showTip(el); });
document.addEventListener('focusout', e => { if (e.target.closest('.slot[data-slot]')) $('#tip').hidden = true; });
document.addEventListener('scroll', () => { $('#tip').hidden = true; }, true);

document.addEventListener('keydown', e => {
  if (e.key==='Escape') { if (!$('#overlay').hidden) closeOverlay(); else if (e.target.id==='setq' && S.q) { S.q = ''; render(); } return; }
  if ((e.key==='ArrowDown' || e.key==='ArrowUp') && S.job && S.section==='sets' && $('#overlay').hidden && S._vis && S._vis.length) {
    const i = S._vis.indexOf(S.sel[S.job]) + (e.key==='ArrowDown' ? 1 : -1);
    if (i < 0 || i >= S._vis.length) return;
    e.preventDefault(); S.sel[S.job] = S._vis[i]; render();
    const cur = $('.setrow[aria-current="true"]'); if (cur) cur.scrollIntoView({block:'nearest'});
  }
});
function boot(){
  const index = window.ATELIER_INDEX || [];
  loadScripts(index.map(e => e.file), () => {
    // <JOB>_<SUB>.js fill ATELIER_SUBS[char][job][sub]; a <JOB>.js of before 2026-10-01 fills ATELIER[char][job]
    DATA = {}; CHARS = {};
    const put = (c, j, d) => { if (!d || !d.sets) return; const s = d.sub || 'NONE';
      const m = ((DATA[c] = DATA[c] || {})[j] = DATA[c][j] || {});
      if (!m[s] || (m[s].at || '') < (d.at || '')) m[s] = d; };
    const legacy = window.ATELIER || {}, subs = window.ATELIER_SUBS || {};
    for (const c in legacy) for (const j in legacy[c]) put(c, j, legacy[c][j]);
    for (const c in subs) for (const j in subs[c]) for (const s in subs[c][j]) put(c, j, subs[c][j][s]);
    for (const c in DATA) CHARS[c] = {jobs: Object.keys(DATA[c])};
    if (!CHARS[S.char]) S.char = Object.keys(CHARS)[0];
    if (!S.char) { $('#view').innerHTML = `<div class="placeholder"><p class="display" style="font-size:22px">Atelier</p><p>${t('tagline')}</p><p>${t('none')}</p></div>`; return; }
    S.job = null; render();
  });
}
boot();
</script>
