<title>GearSwap Atelier</title>
<!-- GearSwap Atelier: open this file in a browser. Data: //gs c atelier in game. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E8ECF3; --panel:#FFFFFF; --panel-2:#F3F5F9; --ink:#121A2C; --muted:#5B6579; --line:#CDD4E1;
  --accent:#2B57C9; --accent-soft:#E2E9FB; --accent-ink:#FFFFFF; --gold:#9A6710; --gold-soft:#F6EBD5;
  --tank:#3E6FA8; --melee:#B0432F; --ranged:#3C8453; --magic:#7351B0; --support:#A07A12;
  --shadow:0 1px 2px rgba(18,26,44,.06),0 4px 14px rgba(18,26,44,.06);
  --display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0B1020; --panel:#141C33; --panel-2:#1A2442; --ink:#E7EBF4; --muted:#97A1B8; --line:#2B3757;
  --accent:#86A6FF; --accent-soft:#1E2B52; --accent-ink:#0B1020; --gold:#E3B458; --gold-soft:#3A3020;
  --tank:#7FA8DA; --melee:#E58A76; --ranged:#7CC896; --magic:#B49BEA; --support:#E2BE5C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1020; --panel:#141C33; --panel-2:#1A2442; --ink:#E7EBF4; --muted:#97A1B8; --line:#2B3757;
  --accent:#86A6FF; --accent-soft:#1E2B52; --accent-ink:#0B1020; --gold:#E3B458; --gold-soft:#3A3020;
  --tank:#7FA8DA; --melee:#E58A76; --ranged:#7CC896; --magic:#B49BEA; --support:#E2BE5C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-family:var(--display);font-size:20px;font-weight:400;letter-spacing:.04em}
.brand span{color:var(--muted);font-size:12px}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:4px 12px;font-size:13px}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg svg{display:block}

.tabs{background:var(--panel);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 10px 8px;font-family:var(--display);font-size:14px;letter-spacing:.05em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab i{width:6px;height:6px;border-radius:50%;background:var(--role,var(--line))}
.tab.off{opacity:.4}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab.home{font-family:var(--sans);font-size:13px;letter-spacing:0}

main{padding-block:24px 48px}
.hello{display:flex;flex-wrap:wrap;align-items:end;gap:12px 32px;margin-bottom:8px}
.hello h1{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.03em}
.hello p{margin:2px 0 0;color:var(--muted)}
.facts{display:flex;gap:24px;flex-wrap:wrap}
.fact b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.role-group{margin-top:26px}
.role-group h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--role);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.role-group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid-jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.jobcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;border-left:4px solid var(--role)}
.jobcard:hover{border-color:var(--role);box-shadow:var(--shadow)}
.jobcard .abbr{font-family:var(--display);font-size:24px;grid-row:span 2;line-height:1}
.jobcard .name{font-weight:600;font-size:13px}
.jobcard .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.jobcard.off{background:var(--panel-2)}
.jobcard.off .abbr{color:var(--muted)}

.jobhead{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;margin-bottom:18px}
.jobhead h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;letter-spacing:.04em}
.jobhead h1 small{font-family:var(--sans);font-size:15px;color:var(--muted);letter-spacing:0;margin-left:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);white-space:nowrap}
.chip.role{color:var(--role);border-color:var(--role);background:transparent;text-transform:uppercase;letter-spacing:.06em}
.quick{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.quick div{font-size:12px;color:var(--muted)}
.quick b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.sections{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.sections button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.sections button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.sections .count{font-size:11px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-right:auto}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:13px}
.filters button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.filters button small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}

.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.setcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.setcard header{padding:12px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.setcard .title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.setcard h3{font-size:16px;font-weight:600}
.setcard code{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.setcard .when{font-size:12.5px;color:var(--muted)}
.variants{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;max-height:92px;overflow:auto}
.variants button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;font-size:12px;padding:2px 9px}
.variants button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.slot{background:var(--panel);padding:8px 10px;min-height:62px;text-align:left;border:0;display:grid;align-content:start;gap:3px}
.slot:hover{background:var(--accent-soft)}
.slot .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.slot .item{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.slot.empty .item{color:var(--muted);font-weight:400}
.slot.inh{background:var(--panel-2)}
.slot.inh .item{color:var(--muted)}
.tag{font-size:10.5px;padding:0 6px;border-radius:4px;border:1px solid var(--gold-soft);background:var(--gold-soft);color:var(--gold);font-family:var(--mono);overflow-wrap:anywhere}
.setcard footer{padding:9px 16px;font-size:12px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--panel-2)}
.setcard footer b{color:var(--ink);font-weight:600}
@media (max-width:560px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 16px 8px}
.rows{list-style:none;margin:0;padding:0 0 6px}
.rows li{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:12px;align-items:center;padding:7px 16px;border-top:1px solid var(--line)}
.kbd{display:inline-flex;gap:3px;flex-wrap:wrap}
.kbd kbd{font-family:var(--mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
.kbd.none{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;align-items:start}
.src{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-family:var(--mono)}
.src.job{color:var(--accent);border-color:var(--accent)}
.src.common{color:var(--ranged);border-color:var(--ranged)}
.src.custom{color:var(--magic);border-color:var(--magic)}
.src.combat,.src.treasure{color:var(--gold);border-color:var(--gold)}
.sub{font-size:11px;color:var(--muted);margin-left:6px}
.values{display:flex;gap:4px;flex-wrap:wrap}
.values span{font-size:12px;padding:1px 8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line)}
.values span.def{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
details.more{margin-top:14px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
@media (max-width:560px){.rows li{grid-template-columns:1fr;gap:4px}}

.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.info{padding:6px 16px 14px;display:grid;gap:6px}
.info .big{font-family:var(--display);font-size:30px;line-height:1}
.info p{margin:0;color:var(--muted);font-size:13px}
.mini{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.mini td,.mini th{padding:5px 16px;border-top:1px solid var(--line);text-align:left}
.mini th{font-weight:500;color:var(--muted)}
.switch{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.switch .sw{width:34px;height:18px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel)}
.switch .sw.on{background:var(--accent)}
.switch .sw.on::after{left:18px}
.switch div{flex:1}
.switch small{display:block;color:var(--muted);font-size:12px}
.placeholder{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:32px;text-align:center;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(8,12,24,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{padding:16px;border-bottom:1px solid var(--line)}
.drawer header small{color:var(--muted);display:block}
.drawer .body{padding:16px;overflow:auto;display:grid;gap:14px;align-content:start}
.note{font-size:13px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:10px 12px}
.choice{display:grid;gap:6px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 12px}
.choice button:hover{border-color:var(--accent)}
.choice button small{display:block;color:var(--muted);font-size:12px}
.drawer footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:41;box-shadow:var(--shadow)}
.dialog header{padding:18px 20px 10px}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.steps span{padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.steps span.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.dialog .body{padding:6px 20px 18px;display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 12px}
.opt:hover{border-color:var(--accent)}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt .state{font-size:11px;white-space:nowrap;color:var(--ranged)}
.dialog footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.mock{font-size:12px;color:var(--muted);text-align:center;padding-block:24px 0}
@media (prefers-reduced-motion:no-preference){.setcard,.jobcard{transition:box-shadow .15s,border-color .15s}}
</style>

/* ---- set grouping ---- */
function family(path, pieces){
  const p = path;
  const slots = Object.keys(pieces||{});
  if (/^sets(\.\w+|\["[^"]+"\])$/.test(p) && slots.length && slots.every(s => ['main','sub','range','ammo'].includes(s)) && !/^sets\.(idle|engaged|MoveSpeed)/.test(p)) return 'weapons';
  if (/^sets\.(idle|Adoulin|Town|me\.idle|resting)/.test(p)) return 'idle';
  if (/^sets\.(engaged|me\.engaged)/.test(p)) return 'engaged';
  if (/^sets\.pet|Pet|pet_/.test(p)) return 'pet';
  if (/^sets\.precast\.FC/.test(p)) return 'fc';
  if (/^sets\.precast\.WS/.test(p)) return 'ws';
  if (/^sets\.precast/.test(p)) return 'ja';
  if (/^sets\.midcast/.test(p)) return 'midcast';
  if (/^sets\.(buff|defense|Kiting|MoveSpeed|TreasureHunter|CombatMode|Doom|latent|FullEnmity|Enmity)/.test(p)) return 'special';
  return 'other';
}
function segs(path){ return path.match(/\.[\w-]+|\["[^"]+"\]/g).map(s => s.startsWith('.') ? s.slice(1) : s.slice(2,-2)); }
function topOf(path, fam){
  const s = segs(path);
  let n = 2;
  if (['fc','ws','ja','midcast'].includes(fam)) n = s[0]==='precast' || s[0]==='midcast' ? (fam==='midcast' ? 2 : 2) : 2;
  if (fam==='ws' || fam==='fc') n = 2;
  if (fam==='ja') n = 3;
  if (fam==='idle' || fam==='engaged') n = s[0]==='me' ? 2 : 1;
  if (fam==='pet') n = s[0]==='pet' ? 2 : 2;
  if (fam==='special') n = s[0]==='buff' ? 2 : 1;
  if (fam==='weapons' || fam==='other') n = s.length;
  return s.slice(0, Math.min(n, s.length));
}
function buildCards(d){
  const bypath = {}; for (const s of d.sets) bypath[s.path] = s;
  const cards = [], index = {};
  for (const s of d.sets) {
    const fam = family(s.path, s.pieces);
    const top = topOf(s.path, fam); const key = fam + '|' + top.join('/');
    if (!index[key]) { index[key] = {fam, name: top[top.length-1], top, variants:[]}; cards.push(index[key]); }
    const rest = segs(s.path).slice(top.length).join(' · ');
    index[key].variants.push({label: rest || 'Base', set: s});
  }
  for (const c of cards) c.variants.sort((a,b) => (a.label==='Base'?-1:b.label==='Base'?1:a.label.localeCompare(b.label)));
  const order = ['idle','engaged','fc','ws','ja','midcast','pet','special','weapons','other'];
  cards.sort((a,b) => order.indexOf(a.fam)-order.indexOf(b.fam) || a.name.localeCompare(b.name));
  return {cards, bypath};
}
function niceName(card){
  const n = card.name;
  const map = {idle:{fr:'Au repos',en:'Idle'}, engaged:{fr:'En combat',en:'Engaged'}, FC:{fr:'Fast Cast',en:'Fast Cast'}, WS:{fr:'Weaponskills',en:'Weaponskills'},
    MoveSpeed:{fr:'Vitesse de course',en:'Movement speed'}, Doom:{fr:'Doom',en:'Doom'}, TreasureHunter:{fr:'Treasure Hunter',en:'Treasure Hunter'}};
  return (map[n] && map[n][S.lang]) || n;

  else if (addStep===1) body = cards.filter(c => c.fam===addFam).flatMap(c => c.variants.map(v => v.set.path)).map(p =>
      `<button class="opt" data-addbase="${esc(p)}"><span style="font-family:var(--mono);font-size:13px">${esc(p)}</span><span class="state">${t('exists')}</span></button>`).join('') + `<p class="mock" style="text-align:left;padding:0">${t('catalog')}</p>`;
  else body = [[t('fromEmpty'),t('fromEmptyD')],[t('fromCopy',{b:shortPath(addBase)}),t('fromCopyD')],[t('fromWorn'),t('fromWornD')]]
      .map(([a,b]) => `<button class="opt" data-close><span>${esc(a)}<small>${esc(b)}</small></span><span>›</span></button>`).join('');
  $('#overlay').innerHTML = `<div class="scrim" data-close></div><div class="dialog" role="dialog" aria-label="${t('addTitle')}"><header><h3>${t('addTitle')}</h3><div class="steps">${steps}</div></header>
    <div class="body">${body}</div><footer><button class="btn ghost" data-back ${addStep===0?'disabled':''}>${t('back')}</button><button class="btn ghost" data-close>${t('cancel')}</button></footer></div>`;
  $('#overlay').hidden = false;
}
function closeOverlay(){ $('#overlay').hidden = true; $('#overlay').innerHTML = ''; }

document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-close]'); if (!b) return; const d = b.dataset;
  if (d.char) { S.char = d.char; S.job = null; closeOverlay(); render(); return; }
  if (d.lang) { S.lang = d.lang; render(); return; }
  if (d.themeSet) { S.theme = d.themeSet; render(); return; }
  if ('job' in d) { S.job = d.job || null; S.section = 'sets'; S.family = 'all'; render(); scrollTo({top:0}); return; }
  if (d.section) { S.section = d.section; render(); return; }
  if (d.family) { S.family = d.family; render(); return; }
  if (d.variant) { S.variant[S.job+'|'+d.card] = +d.variant; render(); return; }
  if (d.slot) { openSlot(+d.card, d.slot); return; }
  if (d.action==='add') { addStep = 0; renderAdd(); return; }
  if (d.addfam) { addFam = d.addfam; addStep = 1; renderAdd(); return; }
  if (d.addbase) { addBase = d.addbase; addStep = 2; renderAdd(); return; }
  if ('back' in d) { addStep = Math.max(0, addStep-1); renderAdd(); return; }
  if ('close' in d) closeOverlay();
});
document.addEventListener('keydown', e => { if (e.key==='Escape') closeOverlay(); });
function boot(){
  const index = window.ATELIER_INDEX || [];
  loadScripts(index.map(e => e.file), () => {
    DATA = window.ATELIER || {}; CHARS = {};
    for (const e of index) if (DATA[e.char] && DATA[e.char][e.job]) (CHARS[e.char] = CHARS[e.char] || {jobs:[]}).jobs.push(e.job);
    if (!CHARS[S.char]) S.char = Object.keys(CHARS)[0];
    if (!S.char) { $('#tagline').textContent = t('tagline'); $('#view').innerHTML = `<div class="placeholder"><p>${t('none')}</p></div>`; return; }
    S.job = null; render();
  });
}
boot();
</script>
